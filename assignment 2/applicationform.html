
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #edf3f6;
            color: #203b50;
            margin: 30px;
        }

        .container {
            background-color: white;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border: 1px solid #cbd8df;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        fieldset {
            border: none;
            padding: 0;
            margin-bottom: 25px;
        }

        legend {
            color: #14777b;
            font-weight: bold;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 7px;
        }

        input:not([type="radio"]):not([type="checkbox"]):not([type="range"]):not([type="color"]),
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #9aafbd;
            border-radius: 3px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        .options label {
            display: inline-block;
            margin-right: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #14777b;
        }

        input[type="color"] {
            margin-left: 100px;
            width: 50px;
            height: 30px;
        }

        textarea {
            height: 75px;
            resize: vertical;
        }

        button {
            background-color: #14777b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #105e62;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Application Form</h1>

    <p>Student internship application · * Required</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- PERSONAL DETAILS -->

        <fieldset>

            <legend>Personal Details</legend>

            <label for="name">Full name *</label>
            <input type="text" id="name" name="name"
                   placeholder="Aarav Sharma" required minlength="3">

            <label for="email">Email *</label>
            <input type="email" id="email" name="email"
                   placeholder="aarav@example.com" required>

            <label for="password">Password *</label>
            <input type="password" id="password" name="password"
                   required minlength="8">

            <label for="phone">Phone *</label>
            <input type="tel" id="phone" name="phone"
                   pattern="[0-9]{10}" placeholder="9876543210" required>

            <label for="portfolio">Portfolio URL</label>
            <input type="url" id="portfolio" name="portfolio"
                   placeholder="https://example.com">

            <label for="age">Age *</label>
            <input type="number" id="age" name="age"
                   min="18" max="60" required>

            <label>Gender:</label>

            <div class="options">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other / prefer not to say
                </label>
            </div>

        </fieldset>


        <!-- EDUCATION DETAILS -->

        <fieldset>

            <legend>Education</legend>

            <label for="course">Course *</label>

            <select id="course" name="course" required>
                <option value="">Select your course</option>
                <option value="BTech">BTech - Computer Science</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="BBA">BBA</option>
            </select>

            <label for="city">Preferred city (datalist)</label>

            <input list="cities" id="city" name="city"
                   placeholder="Delhi">

            <datalist id="cities">
                <option value="Delhi">
                <option value="Mumbai">
                <option value="Jaipur">
                <option value="Bangalore">
                <option value="Haldwani">
            </datalist>

            <label>Skills:</label>

            <div class="options">

                <label>
                    <input type="checkbox" name="skills" value="HTML">
                    HTML
                </label>

                <label>
                    <input type="checkbox" name="skills" value="CSS">
                    CSS
                </label>

                <label>
                    <input type="checkbox" name="skills" value="JavaScript">
                    JavaScript
                </label>

            </div>

        </fieldset>


        <!-- UPLOAD AND EXTRAS -->

        <fieldset>

            <legend>Upload & Extras</legend>

            <label for="date">Available from</label>
            <input type="date" id="date" name="date"
                   value="2026-11-15">

            <label for="time">Interview time</label>
            <input type="time" id="time" name="time"
                   value="10:30">

            <label for="resume">Resume *</label>
            <input type="file" id="resume" name="resume"
                   accept=".pdf,.doc,.docx" required>

            <label for="stipend">
                Expected monthly stipend: ₹
                <output id="amount">10000</output>
            </label>

            <input type="range" id="stipend" name="stipend"
                   min="5000" max="20000" step="1000"
                   value="10000"
                   oninput="amount.value = this.value">

            <label for="colour">Favourite colour:</label>
            <input type="color" id="colour" name="colour"
                   value="#14777b">

            <label for="reason">Why would you like to join?</label>

            <textarea id="reason" name="reason"
                placeholder="Write your reason here...">I want to practise HTML and CSS on real projects.</textarea>

        </fieldset>


        <!-- BUTTONS -->

        <button type="submit">Submit application</button>

        <button type="reset">Reset</button>

    </form>

</div>

</body>
</html>
